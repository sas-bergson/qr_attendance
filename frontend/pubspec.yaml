name: qr_attendance
description: QR Attendance Management System - Flutter Frontend

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0

  # State Management
  provider: ^6.0.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # UI/UX
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  google_fonts: ^5.1.0

  # Environment & Config
  flutter_dotenv: ^5.1.0

  # Authentication
  jwt_decoder: ^2.0.1

  # QR Code
  mobile_scanner: ^3.4.0
  qr_flutter: ^4.0.0

  # URL Launcher
  url_launcher: ^6.1.0

  # Other
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
